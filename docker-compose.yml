services:
  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${S3_API_PORT:?}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:?}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  s3-init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_BUCKET: ${S3_BUCKET:?}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        endpoint="http://rustfs:9000"
        if aws --endpoint-url "$$endpoint" s3api head-bucket \
          --bucket "$$S3_BUCKET" >/dev/null 2>&1; then
          echo "Bucket already exists: $$S3_BUCKET"
        else
          aws --endpoint-url "$$endpoint" s3api create-bucket \
            --bucket "$$S3_BUCKET"
          echo "Bucket created: $$S3_BUCKET"
        fi
    restart: "no"

volumes:
  rustfs_data:
