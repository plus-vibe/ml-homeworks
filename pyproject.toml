
[project]
name = "ds-infrastructure-hw"
version = "0.1.0"
description = "Data Science project infrastructure homework"
readme = "README.md"
authors = [
    { name = "artem", email = "gulamov.art@yandex.ru" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.125",
    "matplotlib>=3.11.2",
    "mlflow==3.16.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[project.scripts]
ds-infrastructure-hw = "ds_infrastructure_hw:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.125",
    "mypy==1.18.2",
    "pre-commit==4.3.0",
    "ruff==0.14.2",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "UP",
    "I",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = '(^|/)(__pycache__|\.venv|build|dist)/'

[[tool.mypy.overrides]]
module = ["third_party_untyped.*"]
ignore_missing_imports = true


# Use CPU-only PyTorch on Linux.
# Other dependencies continue to use PyPI.
[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
